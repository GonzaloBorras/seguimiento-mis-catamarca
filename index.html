<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* --- KPI strip --- */
.kpi-strip{
  position:absolute;top:0;left:0;right:0;z-index:1000;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.85));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:8px 12px;display:flex;align-items:center;gap:8px;
  font-size:12px;white-space:nowrap;overflow-x:auto;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.kpi-strip::-webkit-scrollbar{display:none}
.kpi-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:3px 8px;border-radius:12px;font-weight:600;font-size:11px;
  background:#f3f4f6;flex-shrink:0;
}
.kpi-chip.g{background:#dcfce7;color:#166534}
.kpi-chip.r{background:#fef2f2;color:#991b1b}
.kpi-chip.b{background:#dbeafe;color:#1e40af}
.kpi-chip.o{background:#fff7ed;color:#9a3412}
.kpi-chip.total{background:#f3f4f6;color:#374151}
.kpi-avance{
  margin-left:auto;padding:3px 10px;border-radius:12px;
  background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;
  font-weight:700;font-size:11px;flex-shrink:0;
}

/* --- Bottom stack --- */
.bottom-stack{
  position:fixed;bottom:0;left:0;right:0;z-index:1000;
  display:flex;flex-direction:column;
}

/* --- Sheet (shared) --- */
.sheet{
  background:#fff;
  box-shadow:0 -2px 12px rgba(0,0,0,.12);
  overflow:hidden;
  transition:height .3s cubic-bezier(.4,0,.2,1);
}
.sheet.drag{transition:none}
.sheet-handle{
  padding:8px 0 4px;display:flex;justify-content:center;align-items:center;
  cursor:pointer;flex-shrink:0;
}
.sheet-handle::after{
  content:'';width:36px;height:4px;border-radius:2px;background:#d1d5db;
}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 6px;flex-shrink:0;
}
.sheet-head span{font-weight:700;font-size:13px;color:#111}
.sheet-head .pill{
  padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;
  background:#f3f4f6;color:#555;cursor:pointer;border:none;
}
.sheet-head .pill:active{background:#e5e7eb}
.sheet-body{
  padding:0 16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* --- Avance bar --- */
.avance-wrap{margin-bottom:8px}
.avance-track{
  height:20px;background:#f3f4f6;border-radius:10px;overflow:hidden;
  position:relative;
}
.avance-fill{
  height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);
  border-radius:10px;transition:width .4s ease;
}
.avance-label{
  position:absolute;top:0;left:0;right:0;text-align:center;
  font-size:11px;font-weight:700;line-height:20px;color:#374151;
}

/* --- Vendor bars --- */
.vbar{margin-bottom:4px}
.vbar-top{display:flex;justify-content:space-between;font-size:10px;color:#666;margin-bottom:1px}
.vbar-track{height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.vbar-fill{height:100%;background:#16a34a;border-radius:3px;transition:width .3s}
.vbar-name{cursor:pointer;color:#2563eb;font-weight:600}
.vbar-name:active{opacity:.6}

/* --- Search --- */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{
  width:100%;padding:10px 36px 10px 12px;font-size:15px;
  border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb;
  outline:none;transition:border .2s;
}
.search-wrap input:focus{border-color:#2563eb;background:#fff}
.search-wrap .x{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:none;background:transparent;
  border-radius:50%;font-size:16px;color:#999;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.search-wrap .x:active{background:#f3f4f6}

/* --- Filters grid --- */
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filtros label{font-size:11px;color:#888;margin-bottom:1px;display:block}
.filtros select{
  width:100%;padding:8px 6px;font-size:13px;border:1px solid #e5e7eb;
  border-radius:8px;background:#f9fafb;color:#111;appearance:auto;
  min-height:40px;
}

/* --- Action buttons --- */
.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.actions button{
  padding:10px 4px;font-size:12px;font-weight:600;border:none;
  border-radius:10px;cursor:pointer;min-height:42px;
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.actions .btn-reset{background:#f3f4f6;color:#374151}
.actions .btn-lista{background:#dbeafe;color:#1e40af}
.actions .btn-csv{background:#dcfce7;color:#166534}
.actions .btn-refresh{background:#fef2f2;color:#991b1b}
.actions button:active{opacity:.7}

/* --- Floating controls --- */
.ctrl-fab{
  position:fixed;z-index:1000;
  width:44px;height:44px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.ctrl-fab:active{transform:scale(.92)}
.fab-heat{bottom:68px;left:12px;background:#fff;color:#f97316}
.fab-heat.on{background:#f97316;color:#fff}
.fab-legend{bottom:68px;right:12px;background:#fff;color:#374151}

/* --- Legend bar --- */
.legend-bar{
  position:fixed;bottom:52px;left:12px;right:12px;z-index:999;
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border-radius:10px;
  padding:6px 12px;display:none;align-items:center;justify-content:center;
  gap:12px;font-size:11px;color:#555;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.legend-bar.show{display:flex}
.legend-bar .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend-bar .g{background:#16a34a}
.legend-bar .r{background:#dc2626}
.legend-bar .o{background:#f97316}

/* --- Fullscreen list --- */
.lista-fs{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;
  background:#fff;display:none;flex-direction:column;
}
.lista-fs.show{display:flex}
.lista-fs-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid #f0f0f0;flex-shrink:0;
  background:#fff;
}
.lista-fs-head .back{
  width:36px;height:36px;border:none;background:#f3f4f6;
  border-radius:8px;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lista-fs-head .title{font-weight:700;font-size:15px;flex:1}
.lista-fs-sort{
  display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid #f0f0f0;
  flex-shrink:0;overflow-x:auto;background:#fafafa;
}
.lista-fs-sort::-webkit-scrollbar{display:none}
.lista-fs-sort button{
  padding:5px 10px;font-size:11px;font-weight:600;border:1px solid #e5e7eb;
  border-radius:8px;background:#fff;color:#555;cursor:pointer;white-space:nowrap;
}
.lista-fs-sort button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.lista-fs-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0;
}
.lista-fs-body .item{
  padding:10px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;
}
.lista-fs-body .item:active{background:#f5f5f5}
.lista-fs-body .nm{font-size:13px;font-weight:600}
.lista-fs-body .dt{font-size:11px;color:#888;margin-top:1px}
.lista-fs-body .mt{font-size:11px;color:#aaa;margin-top:2px}
.lista-fs-empty{padding:30px;text-align:center;color:#999;font-size:13px}

/* --- Marker --- */
.pv-marker{background:transparent;border:none}
.pv-m{
  width:26px;height:26px;border-radius:50%;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.8);
}
.pv-v{background:#16a34a}
.pv-p{background:#dc2626}
.pv-r{background:#f97316}

/* --- Popup --- */
.popup-foto{max-width:220px;max-height:160px;border-radius:8px;margin-top:6px;cursor:pointer}

/* --- Dark mode --- */
body.dark .kpi-strip{background:rgba(17,24,39,.92);color:#e5e7eb}
body.dark .kpi-chip{background:#1f2937;color:#d1d5db}
body.dark .kpi-chip.g{background:#064e3b;color:#6ee7b7}
body.dark .kpi-chip.r{background:#450a0a;color:#fca5a5}
body.dark .kpi-chip.b{background:#172554;color:#93c5fd}
body.dark .sheet{background:#111827}
body.dark .sheet-handle::after{background:#4b5563}
body.dark .sheet-head span{color:#e5e7eb}
body.dark .sheet-head .pill{background:#1f2937;color:#d1d5db}
body.dark .sheet-body{background:#111827}
body.dark .search-wrap input{background:#1f2937;color:#e5e7eb;border-color:#374151}
body.dark .search-wrap input:focus{border-color:#3b82f6}
body.dark .filtros select{background:#1f2937;color:#e5e7eb;border-color:#374151}
body.dark .filtros label{color:#9ca3af}
body.dark .actions .btn-reset{background:#1f2937;color:#d1d5db}
body.dark .actions .btn-lista{background:#172554;color:#93c5fd}
body.dark .actions .btn-csv{background:#064e3b;color:#6ee7b7}
body.dark .actions .btn-refresh{background:#450a0a;color:#fca5a5}
body.dark .avance-track{background:#1f2937}
body.dark .avance-label{color:#d1d5db}
body.dark .vbar-track{background:#1f2937}
body.dark .vbar-top{color:#9ca3af}
body.dark .ctrl-fab{background:#1f2937;color:#d1d5db}
body.dark .fab-heat.on{background:#f97316;color:#fff}
body.dark .legend-bar{background:rgba(17,24,39,.92)}
body.dark .legend-bar{color:#d1d5db}
body.dark .lista-fs{background:#111827}
body.dark .lista-fs-head{background:#111827;border-color:#2b3441}
body.dark .lista-fs-head .back{background:#1f2937;color:#d1d5db}
body.dark .lista-fs-head .title{color:#e5e7eb}
body.dark .lista-fs-sort{background:#0d1117;border-color:#2b3441}
body.dark .lista-fs-sort button{background:#1f2937;color:#d1d5db;border-color:#374151}
body.dark .lista-fs-sort button.on{background:#2563eb}
body.dark .lista-fs-body .item{border-color:#1f2937}
body.dark .lista-fs-body .item:active{background:#1f2937}
body.dark .lista-fs-body .nm{color:#e5e7eb}
body.dark .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1f2937;color:#eee}
body.dark .leaflet-popup-content a{color:#93c5fd}
body.dark .leaflet-control-layers,body.dark .leaflet-bar a{background:#1f2937;color:#eee}

/* --- Desktop override --- */
@media(min-width:768px){
  .bottom-stack{
    position:absolute;top:12px;left:12px;right:auto;bottom:auto;
    width:280px;flex-direction:column;
  }
  .sheet{border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
  .kpi-strip{border-radius:0 0 12px 12px}
  .ctrl-fab.fab-legend{display:none}
  .legend-bar{display:flex!important;position:absolute;bottom:12px;left:12px;right:auto;width:auto;border-radius:8px}
  .fab-heat{bottom:auto;top:12px;left:300px}
  .lista-fs{
    position:absolute;top:12px;right:12px;left:auto;bottom:auto;
    width:340px;border-radius:12px;max-height:calc(100vh - 24px);
  }
}
</style>

<script>
var DATOS=[];
var markers=[];
var heatLayer=null;
var heatActive=false;
var listaSortKey='nombre';
var legendVisible=false;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function parseFecha(s){if(!s)return null;var p=s.split('/');if(p.length!==3)return null;return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]))}

var map=L.map('map',{zoomControl:false}).setView([-28.47,-65.78],12);
L.control.zoom({position:'topright'}).addTo(map);

var baseLayers={
  'Claro':L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO'}),
  'Sat\u00e9lite':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri'}),
  'Oscuro':L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO'})
};
baseLayers['Claro'].addTo(map);
L.control.layers(baseLayers,null,{position:'topright'}).addTo(map);
map.on('baselayerchange',function(e){document.body.classList.toggle('dark',e.name==='Oscuro')});

var group=L.markerClusterGroup({
  maxClusterRadius:40,disableClusteringAtZoom:15,
  showCoverageOnHover:false,chunkedLoading:true,
  iconCreateFunction:function(cluster){
    var c=cluster.getChildCount(),ch=0;
    cluster.getAllChildMarkers().forEach(function(m){if(m.options.datos&&m.options.datos[7])ch++});
    var sz=c<20?38:(c<50?46:54);
    var ratio=c>0?ch/c:0;
    var rv=Math.round(220*(1-ratio)+22*ratio);
    var gv=Math.round(38*(1-ratio)+163*ratio);
    var bv=Math.round(38*(1-ratio)+74*ratio);
    return L.divIcon({html:'<div style="background:rgb('+rv+','+gv+','+bv+');color:#fff;border-radius:50%;width:'+sz+'px;height:'+sz+'px;display:flex;align-items:center;justify-content:center;font:bold '+(sz*.4)+'px -apple-system,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.8)">'+c+'</div>',className:'pv-marker',iconSize:[sz,sz]});
  }
});
group.addTo(map);

fetch('data.js?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
  DATOS=JSON.parse(t.replace(/^var DATOS=/,''));
  initMarkers();
});

function initMarkers(){
  var cls=d[9]?'pv-r':(d[7]?'pv-v':'pv-p');
  var sym=d[9]?'?':(d[7]?'\u2713':'\u2715');
  var m=L.marker([d[0],d[1]],{icon:L.divIcon({className:'pv-marker',html:'<div class="pv-m '+cls+'">'+sym+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]})});
  m.options.datos=d;
  var et=d[7]?'VISITADO'+(d[8]>1?' ('+d[8]+')':''):'PENDIENTE';
  var h='<div style="max-width:280px">';
  h+='<div style="font-weight:700;color:'+(d[7]?'#16a34a':'#dc2626')+';font-size:14px">'+et+'</div>';
  if(d[9])h+='<div style="color:#f97316;font-weight:600;font-size:12px">&#9888; A REVISAR</div>';
  h+='<div style="font-weight:700;margin-top:4px">'+esc(d[2])+'</div>';
  h+='<div style="color:#888;font-size:12px">ID: '+esc(d[11])+'</div>';
  h+='<div style="font-size:13px;margin-top:2px">'+esc(d[3])+'</div>';
  h+='<div style="font-size:12px;color:#666;margin-top:2px">'+esc(d[4])+' &middot; '+esc(d[5])+' &middot; '+esc(d[6])+'</div>';
  if(d[10])h+='<div style="font-size:12px;color:#888;margin-top:2px">Visita: '+esc(d[10])+'</div>';
  if(d[12]&&d[12]!=='No hay datos'&&d[12]!=='nan'&&d[12]!=='')h+='<div style="color:#2563eb;font-weight:600;font-size:12px">N&#176; Activo: '+esc(d[12])+'</div>';
  if(d[13]&&d[13]!=='No hay datos'&&d[13]!=='nan'&&d[13]!=='')h+='<div style="color:#2563eb;font-weight:600;font-size:12px">N&#176; Activo 2: '+esc(d[13])+'</div>';
  if((!d[12]||d[12]==='No hay datos'||d[12]==='nan'||d[12]===''))h+='<div style="color:#aaa;font-size:11px">Sin N&#176; Activo</div>';
  if(d[14])h+='<img class="popup-foto" src="'+esc(d[14])+'" loading="lazy" onerror="this.style.display=\'none\'">';
  h+='<div style="margin-top:6px;display:flex;gap:8px">';
  h+='<a href="https://www.google.com/maps/dir/?api=1&destination='+d[0]+','+d[1]+'" target="_blank" style="color:#2563eb;font-size:12px;font-weight:600">Como llegar</a>';
  h+='<a href="#" onclick="copiarDir('+i+');return false" style="color:#666;font-size:12px">Copiar</a>';
  h+='</div></div>';
  m.bindPopup(h);
  markers.push(m);
});
aplicarFiltro(true);
closeSheet(sheetF,document.getElementById('btnFiltros'));
closeSheet(sheetD,document.getElementById('btnDetalles'));
}

function copiarDir(i){
  var t=DATOS[i][2]+' - '+DATOS[i][3]+' ('+DATOS[i][4]+')';
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){alert('Copiado')});
  else{prompt('Copiar:',t)}
}

var elS=document.getElementById('selVendedor');
var elL=document.getElementById('selLocalidad');
var elC=document.getElementById('selCanal');
var elE=document.getElementById('selEstado');
var elA=document.getElementById('selActivo');
var elF=document.getElementById('selFecha');
var elB=document.getElementById('busqueda');
var elStats=document.getElementById('statsBody');
var elKpi=document.getElementById('kpiStrip');
var elAvance=document.getElementById('avanceWrap');
var visiblesCache=[];
var zonaLayer=null;

function cross(o,a,b){return(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0])}
function convexHull(p){
  if(p.length<3)return null;
  p=p.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
  var r=[];
  for(var pass=0;pass<2;pass++){var n=r.length;for(var i=0;i<p.length;i++){var pt=p[i];while(r.length-n>=2&&cross(r[r.length-2],r[r.length-1],pt)<=0)r.pop();r.push(pt)}r.pop();p.reverse()}
  return r;
}

function dibujarZona(v){
  if(zonaLayer){map.removeLayer(zonaLayer);zonaLayer=null}
  var vs=elS.value;
  if(vs==='ALL'||v.length<3)return;
  var h=convexHull(v.map(function(i){return[DATOS[i][0],DATOS[i][1]]}));
  if(!h||h.length<3)return;
  zonaLayer=L.polygon(h,{color:'#2563eb',weight:2,fillColor:'#2563eb',fillOpacity:.08,dashArray:'5 5'}).addTo(map);
  zonaLayer.bindPopup('<b>'+esc(vs)+'</b> &mdash; '+v.length+' PDV');
}

function tieneActivo(d){return(d[12]&&d[12]!=='No hay datos'&&d[12]!=='nan'&&d[12]!=='')||(d[13]&&d[13]!=='No hay datos'&&d[13]!=='nan'&&d[13]!=='')}

function coincide(d){
  if(elS.value!=='ALL'&&d[4]!==elS.value)return false;
  if(elL.value!=='ALL'&&d[5]!==elL.value)return false;
  if(elC.value!=='ALL'&&d[6]!==elC.value)return false;
  if(elE.value==='VIS'&&!d[7])return false;
  if(elE.value==='PEND'&&d[7])return false;
  if(elE.value==='REV'&&!d[9])return false;
  if(elA.value==='CON'&&!tieneActivo(d))return false;
  if(elA.value==='SIN'&&tieneActivo(d))return false;
  var fv=elF.value;
  if(fv!=='ALL'){
    var fd=parseFecha(d[10]);
    if(fv==='SIN'){if(fd)return false}
    else{if(!fd)return false;if((Date.now()-fd.getTime())/(864e5)>parseInt(fv))return false}
  }
  var q=elB.value.trim().toLowerCase();
  if(q&&(d[2]+' '+d[3]+' '+d[11]).toLowerCase().indexOf(q)===-1)return false;
  return true;
}

function actualizarHeat(v){
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null}
  if(!heatActive||v.length===0)return;
  heatLayer=L.heatLayer(v.map(function(i){return[DATOS[i][0],DATOS[i][1],1]}),{radius:25,blur:15,maxZoom:17,max:1,gradient:{.2:'#2563eb',.4:'#22c55e',.6:'#eab308',.8:'#f97316',1:'#dc2626'}}).addTo(map);
}

function aplicarFiltro(encuadrar){
  group.clearLayers();visiblesCache=[];
  DATOS.forEach(function(d,i){if(coincide(d)){visiblesCache.push(i);group.addLayer(markers[i])}});
  var fv=0,fp=0,fr=0,fvis=0,fa=0,vs={};
  visiblesCache.forEach(function(i){
    var d=DATOS[i];fvis+=d[8];
    if(d[9])fr++;if(d[7])fv++;else fp++;if(tieneActivo(d))fa++;
    var vn=d[4];if(!vs[vn])vs[vn]={t:0,v:0};vs[vn].t++;if(d[7])vs[vn].v++;
  });
  var pct=visiblesCache.length?(fv/visiblesCache.length*100).toFixed(1):0;
  document.getElementById('pctBadge').textContent=pct+'%';
  elKpi.innerHTML=
    '<span class="kpi-chip total">'+DATOS.length+' PDV</span>'+
    '<span class="kpi-chip g">'+fv+' visitados</span>'+
    '<span class="kpi-chip r">'+fp+' pend.</span>'+
    (fr?'<span class="kpi-chip o">'+fr+' revisar</span>':'');
  elAvance.innerHTML='<div class="avance-track"><div class="avance-fill" style="width:'+pct+'%"></div><div class="avance-label">'+fv+' / '+visiblesCache.length+' ('+pct+'%)</div></div>';
  var vk=Object.keys(vs).sort();
  if(vk.length>1&&vk.length<=30){
    var sh='';
    vk.forEach(function(n){var s=vs[n];var p=s.t>0?(s.v/s.t*100).toFixed(0):0;var nn=n.replace(/'/g,"\\'");sh+='<div class="vbar"><div class="vbar-top"><span class="vbar-name" onclick="irAVendedor(\''+nn+'\')">'+esc(n)+'</span><span>'+s.v+'/'+s.t+' ('+p+'%)</span></div><div class="vbar-track"><div class="vbar-fill" style="width:'+p+'%"></div></div></div>'});
    elStats.innerHTML=sh;
  }else{elStats.innerHTML='<div style="color:#999">Sin datos</div>'}
  actualizarHeat(visiblesCache);
  actualizarLista();
  dibujarZona(visiblesCache);
  if(encuadrar&&visiblesCache.length>0)map.fitBounds(group.getBounds(),{maxZoom:14,padding:[30,30]});
}

function sortItems(items,key){
  items.sort(function(a,b){
    var da=DATOS[a],db=DATOS[b];
    if(key==='nombre')return da[2].localeCompare(db[2]);
    if(key==='estado')return(db[7]-da[7])||da[2].localeCompare(db[2]);
    if(key==='visitas')return(db[8]-da[8])||da[2].localeCompare(db[2]);
    if(key==='localidad')return da[5].localeCompare(db[5])||da[2].localeCompare(db[2]);
    return 0;
  });
}

function actualizarLista(){
  var items=[];visiblesCache.forEach(function(i){items.push(i)});
  var cont=document.getElementById('listaBody');
  document.getElementById('listaTitulo').textContent=items.length+' PDV';
  if(items.length>250){cont.innerHTML='<div class="lista-fs-empty">'+items.length+' PDV (demasiados). Ajust&#225; filtros.</div>';return}
  sortItems(items,listaSortKey);
  var h='';
  items.forEach(function(i){
    var d=DATOS[i];
    var col=d[9]?'#f97316':(d[7]?'#16a34a':'#dc2626');
    h+='<div class="item" onclick="irA('+i+')">';
    h+='<div class="nm" style="color:'+col+'">'+esc(d[2])+'</div>';
    h+='<div class="dt">'+esc(d[3])+'</div>';
    h+='<div class="mt">'+esc(d[4])+' &middot; '+esc(d[5])+(d[7]?' &#10003; '+d[8]+'v':' &#10005;')+(d[10]?' &middot; '+esc(d[10]):'')+'</div>';
    h+='</div>';
  });
  cont.innerHTML=h;
}

function irA(i){map.closePopup();document.getElementById('listaFs').classList.remove('show');map.setView([DATOS[i][0],DATOS[i][1]],16);setTimeout(function(){markers[i].openPopup()},300)}
function irAVendedor(nombre){elS.value=nombre;aplicarFiltro(true);document.getElementById('volverWrap').style.display='block'}
function reset(){elS.value='ALL';elL.value='ALL';elC.value='ALL';elE.value='ALL';elA.value='ALL';elF.value='ALL';elB.value='';document.getElementById('volverWrap').style.display='none';aplicarFiltro(true)}

function exportXLSX(){
  var rows=[['ID','Nombre','Direccion','Vendedor','Localidad','Canal','Estado','Visitas','Ultima Visita','N Activo','N Activo 2','Lat','Lon']];
  visiblesCache.forEach(function(i){var d=DATOS[i];rows.push([d[11],d[2],d[3],d[4],d[5],d[6],d[7]?'VISITADO':'PENDIENTE',d[8],d[10]||'',d[12]==='nan'?'':d[12],d[13]==='nan'?'':d[13],d[0],d[1]])});
  var ws=XLSX.utils.aoa_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'PDV');
  XLSX.writeFile(wb,'pdv_cat_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ---- Panel toggle (height-based) ---- */
var sheetF=document.getElementById('sheetFiltros');
var sheetD=document.getElementById('sheetDetalles');
var HEAD_H=42;

function openSheet(s,btn){
  s.style.height='';s.style.maxHeight='70vh';
  btn.textContent='Ocultar';
}
function closeSheet(s,btn){
  s.style.height=HEAD_H+'px';s.style.maxHeight=HEAD_H+'px';
  btn.textContent='Mostrar';
}
function isOpen(s){return parseInt(s.style.height)<=HEAD_H||s.style.height===HEAD_H+'px'?false:true}

document.getElementById('btnFiltros').addEventListener('click',function(){
  if(isOpen(sheetF))closeSheet(sheetF,this);else openSheet(sheetF,this);
});
document.getElementById('handleFiltros').addEventListener('click',function(){
  var btn=document.getElementById('btnFiltros');
  if(isOpen(sheetF))closeSheet(sheetF,btn);else openSheet(sheetF,btn);
});
document.getElementById('btnDetalles').addEventListener('click',function(){
  if(isOpen(sheetD))closeSheet(sheetD,this);else openSheet(sheetD,this);
});
document.getElementById('handleDetalles').addEventListener('click',function(){
  var btn=document.getElementById('btnDetalles');
  if(isOpen(sheetD))closeSheet(sheetD,btn);else openSheet(sheetD,btn);
});

/* Drag */
function makeDraggable(s,handle,btnId){
  var startY=0,startH=0,dragging=false;
  handle.addEventListener('touchstart',function(e){dragging=true;startY=e.touches[0].clientY;startH=s.offsetHeight;s.classList.add('drag')},{passive:true});
  window.addEventListener('touchmove',function(e){
    if(!dragging)return;
    var dy=startY-e.touches[0].clientY;
    s.style.height=Math.max(HEAD_H,startH+dy)+'px';s.style.maxHeight='none';
  },{passive:true});
  window.addEventListener('touchend',function(){
    if(!dragging)return;dragging=false;s.classList.remove('drag');
    if(s.offsetHeight<120){s.style.height=HEAD_H+'px';s.style.maxHeight=HEAD_H+'px';document.getElementById(btnId).textContent='Mostrar'}
    else{s.style.height='';s.style.maxHeight='70vh'}
  });
}
makeDraggable(sheetF,document.getElementById('handleFiltros'),'btnFiltros');
makeDraggable(sheetD,document.getElementById('handleDetalles'),'btnDetalles');

/* Filter events */
var debounce=null;
elB.addEventListener('input',function(){clearTimeout(debounce);debounce=setTimeout(function(){aplicarFiltro(false)},200)});
elB.addEventListener('keydown',function(e){if(e.key==='Enter')aplicarFiltro(true)});
document.getElementById('btnLimpiar').addEventListener('click',function(){elB.value='';aplicarFiltro(true)});
[elS,elL,elC,elE,elA,elF].forEach(function(s){s.addEventListener('change',function(){aplicarFiltro(true)})});
document.getElementById('btnReset').addEventListener('click',reset);
document.getElementById('btnVolver').addEventListener('click',function(){elS.value='ALL';document.getElementById('volverWrap').style.display='none';aplicarFiltro(true)});
document.getElementById('btnExport').addEventListener('click',exportXLSX);
document.getElementById('btnRefresh').addEventListener('click',function(){location.reload()});

/* Lista */
document.getElementById('btnLista').addEventListener('click',function(){document.getElementById('listaFs').classList.add('show');actualizarLista()});
document.getElementById('btnCloseLista').addEventListener('click',function(){document.getElementById('listaFs').classList.remove('show')});
document.querySelectorAll('.lista-fs-sort button').forEach(function(b){
  b.addEventListener('click',function(){document.querySelectorAll('.lista-fs-sort button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');listaSortKey=b.getAttribute('data-sort');actualizarLista()})
});

/* Heatmap */
document.getElementById('btnHeat').addEventListener('click',function(){heatActive=!heatActive;this.classList.toggle('on',heatActive);aplicarFiltro(false)});

/* Legend */
document.getElementById('btnLegend').addEventListener('click',function(){legendVisible=!legendVisible;document.getElementById('legendBar').classList.toggle('show',legendVisible)});

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('listaFs').classList.contains('show')){document.getElementById('listaFs').classList.remove('show');return}
    map.closePopup();
  }
});
</script>
